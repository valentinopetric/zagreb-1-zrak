# Build the single-file page and publish it on GitHub Pages (like the reference repo maksimir-pod-kisom).
# Runs on every push to main, and when refresh-data.yml dispatches it after a data commit.
# The site holds dist/index.html plus docs/ (the page footer links to the Markdown chapters).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dist/index.html
        run: python3 tools/build.py
      - name: Assemble the site
        run: |
          mkdir -p site
          cp dist/index.html site/
          cp -r docs site/docs
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
