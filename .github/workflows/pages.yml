# Build the single-file page and publish it on GitHub Pages (like the reference repo maksimir-pod-kisom).
# Runs on every push to main, and when refresh-data.yml dispatches it after a data commit.
# The site holds dist/index.html plus docs/ (the page footer links to the Markdown chapters).
#
# Opt-in: the deploy job runs only when the repository variable PAGES_ENABLED is "true". A Pages site is public even
# for a private repository (except on GitHub Enterprise), and on a free plan Pages needs a public repository. To
# publish: Settings → Pages → Source "GitHub Actions", then Settings → Secrets and variables → Actions → Variables →
# PAGES_ENABLED = true (docs/10-runbook.md §10.6). Without it the job is skipped, not failed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build dist/index.html
        run: python3 tools/build.py
      - name: Assemble the site
        run: |
          mkdir -p site
          cp dist/index.html site/
          cp -r docs site/docs
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
